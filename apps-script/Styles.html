<style>
:root{
  --blue:#4361ee; --blue-2:#4895ef; --sky:#4cc9f0;
  --purple:#7209b7; --purple-2:#560bad; --deep:#3a0ca3;
  --pink:#b5179e; --gold:#ffb703;
  --grad: linear-gradient(135deg,#4361ee 0%,#7209b7 55%,#b5179e 100%);
  --grad-soft: linear-gradient(135deg,#eef2ff 0%,#f5edff 100%);
  --ink:#1b1b2f; --muted:#6b7280;
  --card:#ffffff; --line:#e9e7f5;
  --shadow:0 10px 30px rgba(67,97,238,.12);
}
*{ -webkit-tap-highlight-color:transparent; }
body{
  font-family:'Noto Sans Thai',system-ui,sans-serif;
  background:#f5f6fc; color:var(--ink); margin:0;
  padding-bottom:env(safe-area-inset-bottom);
}
.container-narrow{ max-width:760px; margin:0 auto; padding:0 16px; }

/* ---------------- หน้า login ---------------- */
.login-screen{
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  background:var(--grad); padding:24px; position:relative; overflow:hidden;
}
.login-screen::before,.login-screen::after{
  content:''; position:absolute; border-radius:50%;
  background:rgba(255,255,255,.12); filter:blur(2px);
}
.login-screen::before{ width:320px;height:320px; top:-90px; left:-80px; }
.login-screen::after{ width:260px;height:260px; bottom:-80px; right:-60px; }
.login-card{
  position:relative; z-index:2; background:#fff; border-radius:24px;
  padding:36px 26px; width:100%; max-width:400px; text-align:center;
  box-shadow:0 24px 60px rgba(23,10,60,.35);
}
.login-logo{
  width:78px;height:78px;margin:0 auto 16px; border-radius:24px;
  background:var(--grad); color:#fff; font-size:34px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 24px rgba(114,9,183,.35);
}
.login-title{ font-size:26px; font-weight:800; margin:0 0 6px;
  background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
.login-sub{ color:var(--muted); font-size:14px; margin-bottom:20px; }
.login-status{ color:var(--purple); font-size:14px; font-weight:600; }
.btn-line{ background:#06c755; color:#fff; font-weight:700; border-radius:14px; padding:12px; border:0; }
.btn-line:hover{ background:#05b34c; color:#fff; }
.login-foot{ margin-top:20px; font-size:12px; color:var(--muted); }

/* ---------------- ส่วนหัวโปรไฟล์ ---------------- */
.app-header{
  background:var(--grad); color:#fff; padding:20px 0 22px;
  border-radius:0 0 26px 26px; box-shadow:0 8px 24px rgba(58,12,163,.25);
}
.profile-row{ display:flex; align-items:center; gap:14px; }
.avatar-wrap{ position:relative; flex:0 0 auto; }
.avatar{
  width:64px;height:64px;border-radius:20px;object-fit:cover;
  border:3px solid rgba(255,255,255,.65); background:#ddd;
}
.level-chip{
  position:absolute; bottom:-8px; left:50%; transform:translateX(-50%);
  background:var(--gold); color:#4a2c00; font-size:11px; font-weight:800;
  padding:2px 9px; border-radius:999px; white-space:nowrap;
  box-shadow:0 3px 8px rgba(0,0,0,.2);
}
.pf-hello{ font-size:12px; opacity:.8; }
.pf-name{ font-size:19px; font-weight:800; line-height:1.25;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pf-level{ font-size:12px; opacity:.9; }
.pf-points{ font-size:22px; font-weight:800; color:#ffe89b; white-space:nowrap; }
.pf-points-label{ font-size:11px; opacity:.8; }
.btn-logout{
  background:rgba(255,255,255,.16); color:#fff; border:0;
  border-radius:10px; padding:4px 10px; font-size:12px;
}
.level-progress{ margin-top:16px; font-size:12px; }
.level-progress .progress{ height:10px; border-radius:999px; background:rgba(255,255,255,.25); }
.level-progress .progress-bar{ background:linear-gradient(90deg,#ffd166,#ffb703); border-radius:999px; }
.lv-remain{ font-size:11px; opacity:.85; margin-top:5px; text-align:right; }

.stat-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:16px; }
.stat-box{
  background:rgba(255,255,255,.15); border-radius:14px; padding:10px 4px;
  text-align:center; backdrop-filter:blur(4px);
}
.stat-box i{ font-size:15px; opacity:.9; }
.stat-box b{ display:block; font-size:16px; font-weight:800; line-height:1.4; }
.stat-box span{ font-size:10px; opacity:.85; }

/* ---------------- แท็บ ---------------- */
.tab-nav{ position:sticky; top:0; z-index:20; background:#f5f6fc; padding:12px 0 8px; }
.tab-scroll{ display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; }
.tab-scroll::-webkit-scrollbar{ display:none; }
.tab-btn{
  flex:0 0 auto; border:1px solid var(--line); background:#fff; color:var(--muted);
  border-radius:999px; padding:9px 16px; font-size:13px; font-weight:600; white-space:nowrap;
}
.tab-btn.active{ background:var(--grad); color:#fff; border-color:transparent;
  box-shadow:0 6px 16px rgba(114,9,183,.3); }

.app-main{ padding-bottom:40px; }
.card-x{
  background:var(--card); border:1px solid var(--line); border-radius:20px;
  padding:18px; margin-bottom:14px; box-shadow:var(--shadow);
}
.card-title-x{ font-weight:700; font-size:15px; margin-bottom:12px; color:var(--deep); }
.section-title{ font-weight:700; font-size:15px; margin:18px 0 10px; color:var(--deep); }

/* ---------------- เช็คอิน ---------------- */
.checkin-card{ text-align:center; background:var(--grad-soft); border-color:#e2d9ff; }
.checkin-flame{ font-size:40px; color:var(--pink); }
.checkin-streak{ font-size:34px; font-weight:800; color:var(--purple); line-height:1.1; }
.checkin-streak small{ font-size:14px; color:var(--muted); font-weight:600; }
.checkin-hint{ color:var(--muted); font-size:13px; margin:8px 0 16px; }
.btn-grad{
  background:var(--grad); color:#fff; border:0; border-radius:16px;
  font-weight:700; padding:13px; box-shadow:0 8px 20px rgba(114,9,183,.3);
}
.btn-grad:hover{ color:#fff; filter:brightness(1.05); }
.btn-grad:disabled{ opacity:.55; box-shadow:none; }

.mission-list{ display:flex; flex-direction:column; gap:10px; }
.mission-item{ display:flex; gap:12px; align-items:center; padding:10px;
  border:1px solid var(--line); border-radius:14px; }
.mission-item.done{ background:#f0fdf4; border-color:#bbf7d0; }
.mission-ico{
  width:38px;height:38px;border-radius:12px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center; color:#fff; background:var(--blue);
}
.mission-item.done .mission-ico{ background:#22c55e; }
.mission-name{ font-weight:700; font-size:14px; }
.mission-desc{ font-size:12px; color:var(--muted); }
.mission-bar{ height:6px; border-radius:999px; background:#eee; margin-top:6px; overflow:hidden; }
.mission-bar > i{ display:block; height:100%; background:var(--grad); }
.mission-pts{ font-size:12px; font-weight:700; color:var(--gold); white-space:nowrap; }

/* ---------------- บทเรียน ---------------- */
.lesson-card{ border-left:5px solid var(--blue); }
.lesson-head{ display:flex; gap:12px; align-items:flex-start; }
.lesson-ico{ width:44px;height:44px;border-radius:14px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px; }
.lesson-title{ font-weight:800; font-size:15px; }
.lesson-meta{ font-size:12px; color:var(--muted); }
.lesson-body{ font-size:14px; line-height:1.85; }
.lesson-body h5{ font-size:14px; font-weight:800; color:var(--purple); margin:16px 0 8px; }
.lesson-body ul{ padding-left:20px; }
.lesson-body code{ background:#f1f0fb; color:var(--purple-2); padding:2px 6px; border-radius:6px; }
.lesson-flow{ background:var(--grad-soft); border-radius:12px; padding:10px 12px; font-weight:600; }
.lesson-table th{ background:#f1f0fb; color:var(--deep); font-size:13px; }
.lesson-table td{ font-size:13px; }
.obj-list{ background:#f8f7ff; border-radius:12px; padding:10px 14px 10px 30px; font-size:13px; margin:12px 0; }
.badge-done{ background:#dcfce7; color:#15803d; font-size:11px; font-weight:700;
  padding:3px 9px; border-radius:999px; }

/* ---------------- Quiz ---------------- */
.cat-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; }
.cat-card{
  background:#fff; border:1px solid var(--line); border-radius:18px; padding:14px;
  cursor:pointer; transition:.18s; box-shadow:var(--shadow); text-align:left;
}
.cat-card:hover{ transform:translateY(-3px); }
.cat-ico{ width:42px;height:42px;border-radius:14px; color:#fff; font-size:17px;
  display:flex;align-items:center;justify-content:center; margin-bottom:10px; }
.cat-name{ font-weight:700; font-size:14px; line-height:1.35; min-height:38px; }
.cat-meta{ font-size:11px; color:var(--muted); margin-top:6px; }
.cat-best{ font-size:12px; font-weight:700; margin-top:4px; }

.q-progress{ height:8px; border-radius:999px; background:#ece9fb; overflow:hidden; margin-bottom:14px; }
.q-progress > i{ display:block; height:100%; background:var(--grad); transition:.25s; }
.q-num{ font-size:12px; color:var(--muted); font-weight:600; }
.q-text{ font-size:16px; font-weight:700; line-height:1.7; margin:8px 0 16px; }
.choice{
  display:flex; gap:12px; align-items:flex-start; width:100%; text-align:left;
  background:#fff; border:2px solid var(--line); border-radius:14px;
  padding:12px 14px; margin-bottom:10px; font-size:14px; line-height:1.6;
}
.choice:hover{ border-color:var(--blue-2); }
.choice.selected{ border-color:var(--purple); background:#faf5ff; }
.choice-key{
  width:26px;height:26px;flex:0 0 auto;border-radius:9px;background:#eef0ff;
  color:var(--blue); font-weight:800; font-size:13px;
  display:flex;align-items:center;justify-content:center;
}
.choice.selected .choice-key{ background:var(--purple); color:#fff; }

.score-ring{ text-align:center; padding:6px 0 2px; }
.score-num{ font-size:44px; font-weight:800; line-height:1; }
.score-pass{ color:#16a34a; } .score-fail{ color:#dc2626; }
.review-item{ border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:12px; }
.review-item.correct{ border-left:5px solid #22c55e; }
.review-item.wrong{ border-left:5px solid #ef4444; }
.review-q{ font-weight:700; font-size:14px; line-height:1.7; }
.review-line{ font-size:13px; margin-top:8px; }
.review-explain{
  background:#f8f7ff; border-radius:12px; padding:10px 12px; margin-top:10px;
  font-size:13px; line-height:1.75; color:#3d3a52;
}
.history-list{ display:flex; flex-direction:column; gap:8px; }
.history-item{ display:flex; align-items:center; gap:10px; background:#fff;
  border:1px solid var(--line); border-radius:14px; padding:10px 12px; font-size:13px; }

/* ---------------- Badge ---------------- */
.badge-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:12px; }
.badge-item{ text-align:center; padding:12px 8px; border-radius:18px;
  border:1px solid var(--line); background:#fff; }
.badge-item.locked{ opacity:.55; filter:grayscale(.85); }
.badge-ico{ width:52px;height:52px;margin:0 auto 8px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:21px; }
.badge-name{ font-size:12px; font-weight:700; line-height:1.35; }
.badge-mini{ font-size:10px; color:var(--muted); margin-top:4px; }
.badge-prog{ height:5px;border-radius:999px;background:#eee;margin-top:6px;overflow:hidden; }
.badge-prog > i{ display:block;height:100%;background:var(--grad); }

/* ---------------- อันดับ ---------------- */
.podium{ display:flex; align-items:flex-end; justify-content:center; gap:10px; margin-bottom:14px; }
.podium-col{ text-align:center; flex:1; max-width:120px; }
.podium-img{ width:54px;height:54px;border-radius:50%;object-fit:cover;border:3px solid #fff;
  box-shadow:0 6px 16px rgba(0,0,0,.15); background:#ddd; }
.podium-name{ font-size:12px; font-weight:700; margin-top:6px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
.podium-pts{ font-size:11px; color:var(--muted); }
.podium-stand{ border-radius:14px 14px 0 0; margin-top:8px; color:#fff;
  font-weight:800; display:flex;align-items:center;justify-content:center; }
.p1{ background:linear-gradient(180deg,#ffd166,#ffb703); height:74px; }
.p2{ background:linear-gradient(180deg,#c7d2fe,#8b9cf7); height:56px; }
.p3{ background:linear-gradient(180deg,#f9c6a4,#e08e56); height:44px; }

.rank-list{ display:flex; flex-direction:column; gap:8px; }
.rank-item{ display:flex; align-items:center; gap:10px; padding:9px 12px;
  border:1px solid var(--line); border-radius:14px; background:#fff; }
.rank-item.me{ background:var(--grad-soft); border-color:#d9c9ff; }
.rank-no{ width:28px; font-weight:800; color:var(--muted); text-align:center; flex:0 0 auto; }
.rank-img{ width:38px;height:38px;border-radius:12px;object-fit:cover;background:#ddd;flex:0 0 auto; }
.rank-name{ font-weight:700; font-size:14px; line-height:1.3;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
.rank-sub{ font-size:11px; color:var(--muted); }
.rank-pts{ font-weight:800; color:var(--purple); font-size:14px; white-space:nowrap; }

.app-foot{ text-align:center; font-size:11px; color:var(--muted); padding:16px 0 26px; }
.empty{ text-align:center; color:var(--muted); font-size:13px; padding:22px 0; }

@media (max-width:400px){
  .stat-box b{ font-size:14px; }
  .badge-grid{ grid-template-columns:repeat(3,1fr); }
}
</style>
