<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1080px;height:878px;overflow:hidden;font-family:'Noto Sans Thai',sans-serif}
  .wrap{
    width:1080px;height:878px;position:relative;overflow:hidden;color:#fff;
    /* ดันภาพลงเล็กน้อย ให้เกาะไอโซเมตริกอยู่กลางค่อนล่าง เว้นที่ด้านบนให้หัวเรื่อง */
    background:linear-gradient(160deg,#2a1160 0%,#4a2a90 45%,#6b3fae 100%);
  }
  /* ชั้นล่างสุด ใช้ภาพเดียวกันเบลอเต็มกรอบ ลบขอบสี่เหลี่ยมของภาพต้นฉบับ */
  .bg-blur{
    position:absolute;inset:-60px;width:calc(100% + 120px);height:calc(100% + 120px);
    object-fit:cover;filter:blur(34px) saturate(1.15) brightness(.8);
  }
  /* ชั้นบน ภาพคมชัดขนาดเล็กลง วางชิดล่าง เว้นที่ด้านบนให้หัวเรื่อง */
  .bg-main{
    position:absolute;left:50%;bottom:-40px;transform:translateX(-50%);
    width:842px;height:842px;object-fit:contain;
    -webkit-mask-image:radial-gradient(ellipse 62% 58% at 50% 52%,#000 55%,transparent 78%);
            mask-image:radial-gradient(ellipse 62% 58% at 50% 52%,#000 55%,transparent 78%);
  }
  .scrim-top{
    position:absolute;left:0;right:0;top:0;height:420px;
    background:linear-gradient(to bottom,rgba(20,8,60,.72) 0%,rgba(20,8,60,.38) 60%,rgba(20,8,60,0) 100%);
  }
  /* แถบล่างเว้นให้รูปโปรไฟล์กับชื่อบัญชีของ LINE ทับได้ */
  .scrim-bottom{
    position:absolute;left:0;right:0;bottom:0;height:280px;
    background:linear-gradient(to top,rgba(20,8,60,.85),rgba(20,8,60,0));
  }

  .content{position:relative;padding:64px 70px 0;text-align:center}
  .badge{
    display:inline-flex;align-items:center;gap:12px;
    background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.34);
    padding:11px 26px;border-radius:999px;font-size:23px;font-weight:700;
    backdrop-filter:blur(6px);
  }
  h1{
    font-size:80px;font-weight:800;margin-top:22px;letter-spacing:1px;line-height:1;
    text-shadow:0 10px 34px rgba(10,3,40,.9),0 3px 10px rgba(10,3,40,.7);
  }
  h2{
    font-size:35px;font-weight:700;margin-top:16px;color:#ffe06b;
    text-shadow:0 6px 20px rgba(10,3,40,.85);
  }
  .desc{
    font-size:24px;font-weight:500;margin-top:14px;line-height:1.6;
    text-shadow:0 4px 16px rgba(10,3,40,.85);
  }

  .chips{
    position:absolute;left:0;right:0;bottom:196px;
    display:flex;flex-wrap:wrap;gap:13px;justify-content:center;
  }
  .chip{
    background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);
    border-radius:999px;padding:10px 20px;font-size:20px;font-weight:700;
    display:flex;align-items:center;gap:9px;backdrop-filter:blur(6px);
    text-shadow:0 2px 8px rgba(10,3,40,.7);
  }
  .chip i{font-size:18px;opacity:.92}
</style>
</head>
<body>
  <div class="wrap">
    <img class="bg-blur" src="ai-cover.jpg" alt="">
    <img class="bg-main" src="ai-cover.jpg" alt="">
    <div class="scrim-top"></div>
    <div class="scrim-bottom"></div>

    <div class="content">
      <div class="badge"><i class="fa-solid fa-graduation-cap"></i> ระบบการเรียนรู้ออนไลน์</div>
      <h1>Internet Quest</h1>
      <h2>21910-2002 อินเทอร์เน็ตในงานธุรกิจดิจิทัล</h2>
      <div class="desc">
        เรียน ทบทวน ทำแบบทดสอบ สะสมแต้มและเหรียญตรา<br>
        เข้าสู่ระบบด้วยบัญชี LINE ได้ทันที
      </div>
    </div>

    <div class="chips">
      <div class="chip"><i class="fa-solid fa-calendar-check"></i> เช็คอินรายวัน</div>
      <div class="chip"><i class="fa-solid fa-book"></i> บทเรียน 6 หน่วย</div>
      <div class="chip"><i class="fa-solid fa-clipboard-question"></i> Quiz 60 ข้อ</div>
      <div class="chip"><i class="fa-solid fa-medal"></i> เหรียญตรา 12 ใบ</div>
    </div>
  </div>
</body>
</html>
