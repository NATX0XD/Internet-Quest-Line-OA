<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:640px;height:640px;overflow:hidden;font-family:'Noto Sans Thai',sans-serif}
  .wrap{
    width:640px;height:640px;position:relative;overflow:hidden;
    background:#1a0a3d url('ai-profile.jpg') center/cover no-repeat;
  }
  /* ไล่สีเข้มจากขอบล่าง ให้ตัวหนังสืออ่านออกโดยไม่บังลูกโลก */
  .scrim{
    position:absolute;inset:0;
    background:linear-gradient(to top,rgba(12,3,40,.88) 0%,rgba(12,3,40,.55) 22%,rgba(12,3,40,0) 46%);
  }
  /* LINE ครอบเป็นวงกลม จึงเว้นขอบด้านในไว้ไม่ให้ข้อความโดนตัด */
  .ring{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:600px;height:600px;border-radius:50%;
    border:3px solid rgba(255,255,255,.28);
  }
  .text{
    position:absolute;left:0;right:0;bottom:74px;text-align:center;color:#fff;
  }
  .name{
    font-size:62px;font-weight:800;letter-spacing:.5px;line-height:1;
    text-shadow:0 6px 24px rgba(8,2,30,.85),0 2px 6px rgba(8,2,30,.6);
  }
  .sub{
    margin-top:12px;font-size:27px;font-weight:700;color:#ffe06b;
    text-shadow:0 4px 16px rgba(8,2,30,.8);
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="scrim"></div>
    <div class="ring"></div>
    <div class="text">
      <div class="name">Internet Quest</div>
      <div class="sub">21910-2002</div>
    </div>
  </div>
</body>
</html>
