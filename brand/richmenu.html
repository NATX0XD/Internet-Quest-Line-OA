<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:2500px;height:1686px;overflow:hidden;font-family:'Noto Sans Thai',sans-serif}

  /* ตาราง 3 คอลัมน์ 2 แถว ช่องละ 833.33 x 843 ตรงกับพิกัดในไฟล์ areas.json */
  .menu{
    width:2500px;height:1686px;display:grid;
    grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);
    background:#3a0ca3;
  }
  .cell{
    position:relative;display:flex;flex-direction:column;
    align-items:center;justify-content:center;color:#fff;overflow:hidden;
    border-right:3px solid rgba(255,255,255,.16);
    border-bottom:3px solid rgba(255,255,255,.16);
  }
  .cell:nth-child(3n){border-right:none}
  .cell:nth-child(n+4){border-bottom:none}

  .cell .bubble{
    position:absolute;border-radius:50%;background:rgba(255,255,255,.10);
  }
  .b1{width:300px;height:300px;top:-110px;right:-90px}
  .b2{width:200px;height:200px;bottom:-80px;left:-60px}

  .ico{
    position:relative;width:210px;height:210px;border-radius:64px;
    background:rgba(255,255,255,.20);border:4px solid rgba(255,255,255,.35);
    display:flex;align-items:center;justify-content:center;
    font-size:108px;margin-bottom:38px;
    box-shadow:0 18px 44px rgba(10,2,40,.28);
  }
  .label{position:relative;font-size:74px;font-weight:800;letter-spacing:.5px;
         text-shadow:0 8px 22px rgba(10,2,40,.35)}
  .note{position:relative;font-size:38px;font-weight:600;margin-top:12px;opacity:.88}

  .c1{background:linear-gradient(140deg,#4361ee,#4895ef)}
  .c2{background:linear-gradient(140deg,#4895ef,#4cc9f0)}
  .c3{background:linear-gradient(140deg,#7209b7,#560bad)}
  .c4{background:linear-gradient(140deg,#560bad,#3a0ca3)}
  .c5{background:linear-gradient(140deg,#b5179e,#f72585)}
  .c6{background:linear-gradient(140deg,#3a0ca3,#7209b7)}
</style>
</head>
<body>
  <div class="menu">
    <div class="cell c1">
      <div class="bubble b1"></div><div class="bubble b2"></div>
      <div class="ico"><i class="fa-solid fa-calendar-check"></i></div>
      <div class="label">เช็คอิน</div>
      <div class="note">รับแต้มทุกวัน</div>
    </div>
    <div class="cell c2">
      <div class="bubble b1"></div><div class="bubble b2"></div>
      <div class="ico"><i class="fa-solid fa-book"></i></div>
      <div class="label">บทเรียน</div>
      <div class="note">6 หน่วยการเรียน</div>
    </div>
    <div class="cell c3">
      <div class="bubble b1"></div><div class="bubble b2"></div>
      <div class="ico"><i class="fa-solid fa-clipboard-question"></i></div>
      <div class="label">Quiz</div>
      <div class="note">6 หมวด หมวดละ 10 ข้อ</div>
    </div>
    <div class="cell c4">
      <div class="bubble b1"></div><div class="bubble b2"></div>
      <div class="ico"><i class="fa-solid fa-medal"></i></div>
      <div class="label">เหรียญตรา</div>
      <div class="note">สะสมครบ 12 ใบ</div>
    </div>
    <div class="cell c5">
      <div class="bubble b1"></div><div class="bubble b2"></div>
      <div class="ico"><i class="fa-solid fa-trophy"></i></div>
      <div class="label">อันดับ</div>
      <div class="note">คะแนนสูงสุด</div>
    </div>
    <div class="cell c6">
      <div class="bubble b1"></div><div class="bubble b2"></div>
      <div class="ico"><i class="fa-solid fa-globe"></i></div>
      <div class="label">เข้าเว็บเรียน</div>
      <div class="note">internet-quest.vercel.app</div>
    </div>
  </div>
</body>
</html>
